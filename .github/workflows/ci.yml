name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore SA.Inbetween.sln
      - name: Build (warnings as errors)
        run: dotnet build SA.Inbetween.sln --no-restore -c Release -warnaserror
      - name: Format
        run: dotnet format SA.Inbetween.sln --no-restore --verify-no-changes
      - name: Architecture tests
        run: dotnet test --no-build -c Release --project tests/SA.Inbetween.Architecture.Tests
      - name: Tests
        run: dotnet test --no-build -c Release --project tests/SA.Inbetween.Tests
      - name: CLI tests
        run: dotnet test --no-build -c Release --project tests/SA.Inbetween.Cli.Tests
      - name: ONNX tests
        run: dotnet test --no-build -c Release --project tests/SA.Inbetween.Onnx.Tests
      - name: Windows smoke script parses (PowerShell 7)
        shell: pwsh
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/windows-smoke.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
      - name: Windows smoke script parses (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\windows-smoke.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
